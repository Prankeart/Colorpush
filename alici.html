<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Alıcı — Optik Transfer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #111; color: #eee; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 16px; background: #1a1a1a; display: flex; justify-content: space-between;
           align-items: center; border-bottom: 1px solid #333; flex-shrink: 0; }
  header h1 { font-size: 15px; font-weight: 600; }
  header a { color: #6cf; text-decoration: none; font-size: 13px; }
  .video-wrap { flex: 1; position: relative; background: #000; min-height: 0; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #debugCanvas { position: absolute; top: 8px; right: 8px; width: 96px; height: 96px;
                 border: 1px solid #444; background: #000; image-rendering: pixelated;
                 border-radius: 4px; }
  .hint { position: absolute; bottom: 8px; left: 8px; right: 8px; color: #6cf; font-size: 11px;
          text-align: center; text-shadow: 0 0 4px #000; pointer-events: none;
          font-family: ui-monospace, monospace; }
  .progress { height: 4px; background: #222; flex-shrink: 0; }
  .progress > div { height: 100%; background: #6cf; width: 0%; transition: width 0.2s; }
  .controls { padding: 10px 16px; background: #1a1a1a; display: flex; gap: 8px; flex-shrink: 0; }
  button { flex: 1; padding: 10px 12px; border: none; border-radius: 6px; background: #6cf;
           color: #000; font-weight: 600; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.danger { background: #f66; }
  .status { padding: 6px 16px; background: #1a1a1a; font-size: 11px; color: #888;
            font-family: ui-monospace, monospace; display: flex; gap: 14px;
            flex-wrap: wrap; flex-shrink: 0; }
  .status span { color: #eee; }
  .status span.ok { color: #6f6; }
  .result { padding: 12px 16px; background: #0a0a0a; border-top: 1px solid #333;
            max-height: 30vh; overflow-y: auto; }
  .result pre { font-family: ui-monospace, monospace; font-size: 13px; color: #6cf;
                white-space: pre-wrap; word-break: break-word; }
  .result.hidden { display: none; }
  .result h3 { font-size: 12px; color: #888; margin-bottom: 6px; font-weight: normal; }
</style>
</head>
<body>
<header>
  <h1>📷 Alıcı</h1>
  <a href="index.html">← Ana</a>
</header>
<div class="video-wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="debugCanvas" width="8" height="8"></canvas>
  <div class="hint" id="hint">Grid'i kameraya göster — otomatik bulunacak</div>
</div>
<div class="progress"><div id="progressBar"></div></div>
<div class="controls">
  <button id="start">▶ Kamerayı Aç</button>
  <button id="stop" class="danger" disabled>■ Durdur</button>
  <button id="reset">↻</button>
</div>
<div class="status">
  <div>Okunan: <span id="readInfo">0</span></div>
  <div>Toplanan: <span id="gotInfo" class="ok">0</span></div>
  <div>Hedef: <span id="totalInfo">?</span></div>
  <div>Durum: <span id="stateInfo">—</span></div>
</div>
<div class="result hidden" id="resultBox">
  <h3>Gelen veri:</h3>
  <pre id="result"></pre>
</div>

<script src="shared.js"></script>
<script>
  const video = document.getElementById('video');
  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  const resetBtn = document.getElementById('reset');
  const readInfo = document.getElementById('readInfo');
  const gotInfo = document.getElementById('gotInfo');
  const totalInfo = document.getElementById('totalInfo');
  const stateInfo = document.getElementById('stateInfo');
  const resultBox = document.getElementById('resultBox');
  const resultPre = document.getElementById('result');
  const progressBar = document.getElementById('progressBar');
  const debugCanvas = document.getElementById('debugCanvas');
  const dctx = debugCanvas.getContext('2d');

  const sampleCanvas = document.createElement('canvas');
  const sctx = sampleCanvas.getContext('2d', { willReadFrequently: true });
  const SAMPLE_SIZE = 320;

  let stream = null;
  let running = false;
  let rafId = null;
  let receivedMap = new Map();
  let knownTotal = null;
  let knownLength = null;
  let readCount = 0;
  let boundsInfo = '-';

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width:  { ideal: 1920 },
          height: { ideal: 1080 }
        }
      });
      video.srcObject = stream;
      await video.play();
      // Autofocus sürekli olsun (destekleyen cihazlarda)
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps.focusMode && caps.focusMode.includes('continuous')) {
        track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
      }
      running = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      stateInfo.textContent = 'kamera açık';
      loop();
    } catch (err) {
      alert('Kamera açılamadı: ' + err.message);
    }
  }

  function stopCamera() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    stateInfo.textContent = 'durdu';
  }

  // ---- GRID TESPİTİ ----
  // Renkli VE parlak pikselleri bul, uç değerleri %5'lik dilimden at
  function detectGridBounds(imgData) {
    const w = imgData.width, h = imgData.height, data = imgData.data;
    const xs = [], ys = [];

    for (let y = 0; y < h; y += 2) {
      const rowBase = y * w * 4;
      for (let x = 0; x < w; x += 2) {
        const i = rowBase + x * 4;
        const r = data[i], g = data[i+1], b = data[i+2];
        const maxc = Math.max(r, g, b);
        const minc = Math.min(r, g, b);
        // Yüksek doygunluk VE yeterli parlaklık
        if (maxc > 100 && (maxc - minc) > 60) {
          xs.push(x); ys.push(y);
        }
      }
    }

    if (xs.length < 150) return null;

    xs.sort((a,b) => a-b);
    ys.sort((a,b) => a-b);
    const pct = (arr, p) => arr[Math.min(arr.length - 1, Math.max(0, Math.floor(arr.length * p)))];

    const x0 = pct(xs, 0.04), x1 = pct(xs, 0.96);
    const y0 = pct(ys, 0.04), y1 = pct(ys, 0.96);
    const bw = x1 - x0, bh = y1 - y0;
    if (bw < 30 || bh < 30) return null;

    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const size = Math.max(bw, bh);

    let bx = Math.round(cx - size / 2);
    let by = Math.round(cy - size / 2);
    let s  = Math.round(size);

    if (bx < 0) { s += bx; bx = 0; }
    if (by < 0) { s += by; by = 0; }
    if (bx + s > w) s = w - bx;
    if (by + s > h) s = h - by;
    if (s < 40) return null;

    return { x: bx, y: by, size: s };
  }

  function readCellsInBounds(imgData, bounds) {
    const data = imgData.data;
    const imgW = imgData.width;
    const { x, y, size } = bounds;
    const cellSize = size / GRID_SIZE;
    const cells = new Uint8Array(CELLS);
    const margin = Math.max(2, Math.floor(cellSize * 0.22));

    for (let cy = 0; cy < GRID_SIZE; cy++) {
      for (let cx = 0; cx < GRID_SIZE; cx++) {
        const px0 = Math.floor(x + cx * cellSize + margin);
        const py0 = Math.floor(y + cy * cellSize + margin);
        const px1 = Math.floor(x + (cx + 1) * cellSize - margin);
        const py1 = Math.floor(y + (cy + 1) * cellSize - margin);
        let rSum = 0, gSum = 0, bSum = 0, count = 0;
        for (let py = py0; py < py1; py++) {
          if (py < 0 || py >= imgData.height) continue;
          const rowBase = py * imgW * 4;
          for (let px = px0; px < px1; px++) {
            if (px < 0 || px >= imgW) continue;
            const i = rowBase + px * 4;
            rSum += data[i]; gSum += data[i+1]; bSum += data[i+2];
            count++;
          }
        }
        cells[cy * GRID_SIZE + cx] = count === 0
          ? 0
          : classifyColor(rSum/count, gSum/count, bSum/count);
      }
    }
    return cells;
  }

  function drawDebug(cells) {
    const cs = debugCanvas.width / GRID_SIZE;
    for (let cy = 0; cy < GRID_SIZE; cy++) {
      for (let cx = 0; cx < GRID_SIZE; cx++) {
        const c = PALETTE[cells[cy * GRID_SIZE + cx]];
        dctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
        dctx.fillRect(cx * cs, cy * cs, cs, cs);
      }
    }
  }

  function loop() {
    if (!running) return;
    rafId = requestAnimationFrame(loop);
    if (video.readyState < 2) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;

    // Video'nun ortadaki kare bölgesini örnekle
    const cropSize = Math.min(vw, vh);
    const cropX = (vw - cropSize) / 2;
    const cropY = (vh - cropSize) / 2;

    if (sampleCanvas.width !== SAMPLE_SIZE) {
      sampleCanvas.width = SAMPLE_SIZE;
      sampleCanvas.height = SAMPLE_SIZE;
    }
    sctx.drawImage(video, cropX, cropY, cropSize, cropSize, 0, 0, SAMPLE_SIZE, SAMPLE_SIZE);

    const imgData = sctx.getImageData(0, 0, SAMPLE_SIZE, SAMPLE_SIZE);
    const bounds = detectGridBounds(imgData);
    if (!bounds) {
      stateInfo.textContent = 'grid yok';
      return;
    }
    boundsInfo = `${bounds.x},${bounds.y},${bounds.size}`;

    const cells = readCellsInBounds(imgData, bounds);
    drawDebug(cells);
    const frame = cellsToFrame(cells);

    readCount++;
    readInfo.textContent = readCount;

    if (!validateFrame(frame)) {
      stateInfo.textContent = 'crc hata ' + boundsInfo;
      return;
    }

    const info = parseFrameHeader(frame);
    if (info.total === 0 || info.total > 2000) return;
    if (info.length === 0 || info.length > 20000) return;
    if (info.index >= info.total) return;

    knownTotal = info.total;
    knownLength = info.length;
    totalInfo.textContent = knownTotal;
    stateInfo.textContent = 'ok ' + boundsInfo;

    if (!receivedMap.has(info.index)) {
      receivedMap.set(info.index, frame);
      gotInfo.textContent = receivedMap.size;
      updateProgress();
      checkComplete();
    }
  }

  function updateProgress() {
    if (!knownTotal) return;
    progressBar.style.width = ((receivedMap.size / knownTotal) * 100) + '%';
  }

  function checkComplete() {
    if (!knownTotal || !knownLength) return;
    if (receivedMap.size < knownTotal) return;
    const assembled = assembleData(receivedMap, knownTotal, knownLength);
    if (!assembled) return;
    try {
      const text = new TextDecoder().decode(assembled);
      resultPre.textContent = text;
      resultBox.classList.remove('hidden');
      stopCamera();
    } catch (err) {
      resultPre.textContent = '(Çözümlenemedi: ' + err.message + ')';
      resultBox.classList.remove('hidden');
    }
  }

  function reset() {
    receivedMap.clear();
    knownTotal = null; knownLength = null;
    readCount = 0;
    gotInfo.textContent = '0';
    totalInfo.textContent = '?';
    readInfo.textContent = '0';
    stateInfo.textContent = '—';
    progressBar.style.width = '0%';
    resultBox.classList.add('hidden');
    resultPre.textContent = '';
    dctx.fillStyle = '#000';
    dctx.fillRect(0, 0, debugCanvas.width, debugCanvas.height);
  }

  startBtn.addEventListener('click', startCamera);
  stopBtn.addEventListener('click', stopCamera);
  resetBtn.addEventListener('click', reset);
</script>
</body>
</html>
