<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Verici — Optik Transfer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               background: #000; color: #eee; overflow: hidden; }
  body { display: flex; flex-direction: column; }

  header, .controls, .status { transition: opacity 0.2s; }
  body.transmitting header,
  body.transmitting .controls,
  body.transmitting .status { opacity: 0; pointer-events: none; height: 0; padding: 0; overflow: hidden; }

  header { padding: 8px 16px; background: #1a1a1a; display: flex; justify-content: space-between;
           align-items: center; border-bottom: 1px solid #333; flex-shrink: 0; }
  header h1 { font-size: 15px; font-weight: 600; }
  header a { color: #6cf; text-decoration: none; font-size: 13px; }

  .controls { padding: 10px 16px; background: #1a1a1a; display: flex; flex-direction: column;
              gap: 8px; flex-shrink: 0; }
  textarea { width: 100%; padding: 8px; background: #222; color: #eee; border: 1px solid #444;
             border-radius: 6px; font-family: ui-monospace, monospace; font-size: 13px;
             resize: vertical; }
  .buttons { display: flex; gap: 8px; }
  button { flex: 1; padding: 10px 12px; border: none; border-radius: 6px; background: #6cf;
           color: #000; font-weight: 600; font-size: 13px; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.danger { background: #f66; }
  button.secondary { background: #333; color: #eee; flex: 0 0 50px; }

  .screen { flex: 1; position: relative; background: #000; min-height: 0; overflow: hidden; }
  #canvas {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width:  min(100%, 100vh);
    height: min(100%, 100vh);
    image-rendering: pixelated;
    display: block;
  }

  .status { padding: 6px 16px; background: #1a1a1a; font-size: 11px; color: #888;
            font-family: ui-monospace, monospace; display: flex; gap: 16px;
            flex-wrap: wrap; flex-shrink: 0; }
  .status span { color: #eee; }
</style>
</head>
<body>
<header>
  <h1>📡 Verici</h1>
  <a href="index.html">← Ana</a>
</header>
<div class="controls">
  <textarea id="input" rows="2" placeholder="Gönderilecek metin...">Merhaba dünya! Bu bir test mesajıdır.</textarea>
  <div class="buttons">
    <button id="start">▶ Başlat</button>
    <button id="stop" class="danger" disabled>■ Durdur</button>
    <button id="fs" class="secondary">⛶</button>
  </div>
</div>
<div class="screen">
  <canvas id="canvas" width="512" height="512"></canvas>
</div>
<div class="status">
  <div>Frame: <span id="frameInfo">—</span></div>
  <div>FPS: <span id="fpsInfo">—</span></div>
  <div>Veri: <span id="totalInfo">—</span></div>
</div>

<script src="shared.js"></script>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const input = document.getElementById('input');
  const startBtn = document.getElementById('start');
  const stopBtn = document.getElementById('stop');
  const fsBtn = document.getElementById('fs');
  const frameInfo = document.getElementById('frameInfo');
  const fpsInfo = document.getElementById('fpsInfo');
  const totalInfo = document.getElementById('totalInfo');

  let frames = [];
  let currentFrame = 0;
  let timer = null;
  let fpsCounter = 0;
  let fpsLastTime = 0;
  const targetFps = 4; // Biraz yavaşlattık, alıcının yakalaması kolay olsun

  function drawPlaceholder() {
    const size = canvas.width;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#333';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Hazır', size/2, size/2);
  }

  function drawFrame(idx) {
    if (frames.length === 0) { drawPlaceholder(); return; }
    const size = canvas.width;
    const cellSize = size / GRID_SIZE;

    // Arka plan siyah (grid dışı ile karışmasın diye margin yok)
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, size, size);

    const cells = frameToCells(frames[idx]);
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        const c = PALETTE[cells[y * GRID_SIZE + x]];
        ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
        // Hücre arasında 1px siyah boşluk → renkler birbirine karışmasın
        ctx.fillRect(x * cellSize + 1, y * cellSize + 1, cellSize - 2, cellSize - 2);
      }
    }
  }

  function tick() {
    if (frames.length === 0) return;
    drawFrame(currentFrame);
    frameInfo.textContent = `${currentFrame + 1} / ${frames.length}`;

    fpsCounter++;
    const now = performance.now();
    if (now - fpsLastTime >= 1000) {
      fpsInfo.textContent = fpsCounter;
      fpsCounter = 0;
      fpsLastTime = now;
    }

    currentFrame = (currentFrame + 1) % frames.length;
  }

  async function goFullscreen() {
    try {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      }
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('portrait').catch(() => {});
      }
    } catch (e) { /* ignore */ }
  }

  async function start() {
    const text = input.value;
    if (!text) return;
    const bytes = new TextEncoder().encode(text);
    const result = encodeFrames(bytes);
    frames = result.frames;
    currentFrame = 0;
    totalInfo.textContent = `${bytes.length} B / ${result.numFrames} frame`;
    fpsLastTime = performance.now();
    fpsCounter = 0;
    if (timer) clearInterval(timer);
    document.body.classList.add('transmitting');
    await goFullscreen();
    timer = setInterval(tick, 1000 / targetFps);
    tick();
    startBtn.disabled = true;
    stopBtn.disabled = false;
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
    document.body.classList.remove('transmitting');
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
  fsBtn.addEventListener('click', goFullscreen);

  drawPlaceholder();
</script>
</body>
</html>
